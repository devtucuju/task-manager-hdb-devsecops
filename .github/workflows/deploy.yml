# =============================================================================
# Deploy Pipeline — deploy contínuo para produção (Task Manager DevSecOps)
# =============================================================================
# Dispara apenas em push na branch main. Constrói a imagem Docker, publica no
# Docker Hub com as tags `latest` e a versão derivada de git tag, e notifica
# sucesso (Slack opcional).
#
# Secrets necessários no repositório (Settings → Secrets and variables → Actions):
#   DOCKER_USERNAME  — usuário do Docker Hub
#   DOCKER_PASSWORD  — token de acesso do Docker Hub (não use a senha da conta)
#   SLACK_WEBHOOK_URL — (opcional) URL do Incoming Webhook do Slack
# =============================================================================

name: Deploy Pipeline

on:
  # Deploy de produção exclusivamente em push na branch main
  push:
    branches:
      - main

# Permissões mínimas — apenas leitura do código-fonte
permissions:
  contents: read

env:
  # Nome da imagem no Docker Hub: <DOCKER_USERNAME>/task-manager
  IMAGE_NAME: task-manager

jobs:
  # ---------------------------------------------------------------------------
  # Job único: build, push e notificação da imagem de produção
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy produção
    runs-on: ubuntu-latest
    environment: production

    steps:
      # a) Checkout do código-fonte (fetch-depth: 0 para histórico completo de tags)
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # b) Configura Docker Buildx para builds otimizados no runner
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      # Obtém a versão a partir de git tags para taguear a imagem
      - name: Obter versão (git tag)
        id: version
        run: |
          # Se o commit atual possui uma tag anotada/leve, usa-a como versão
          if TAG=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            VERSION="$TAG"
          else
            # Caso contrário, usa a tag mais recente + identificador do commit
            BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            VERSION="${BASE_TAG}-build.${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versão da imagem: ${VERSION}"

      # c) Build da imagem Docker com tags `latest` e versão (git tag)
      - name: Build imagem Docker
        run: |
          docker build \
            -t "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest" \
            -t "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" \
            .

      # d) Autenticação no Docker Hub via secrets (nunca commitar credenciais)
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # e) Publica ambas as tags no Docker Hub
      - name: Push imagem para Docker Hub
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

      # f) Notificação de sucesso via Slack (opcional — requer SLACK_WEBHOOK_URL)
      #    Para desabilitar, comente ou remova este step.
      - name: Notificar sucesso no Slack
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Deploy concluído com sucesso!\n• Imagem: `${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}`\n• Tag latest atualizada\n• Commit: `${{ github.sha }}`\n• Branch: `${{ github.ref_name }}`"
            }

      # Resumo no log do workflow (sempre executado após push bem-sucedido)
      - name: Resumo do deploy
        if: success()
        run: |
          echo "Deploy finalizado."
          echo "Imagem publicada: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "Versão:           ${{ steps.version.outputs.version }}"

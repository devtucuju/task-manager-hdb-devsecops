# =============================================================================
# CI Pipeline — integração contínua do Task Manager DevSecOps
# =============================================================================
# Executa testes, lint e build da imagem Docker em cada push/PR nas branches
# principais. Jobs de test e lint rodam em paralelo; build só inicia após ambos.
# =============================================================================

name: CI Pipeline

on:
  # Dispara em pushes diretos às branches de integração e release
  push:
    branches: [main, master, develop, homolog]
  pull_request:
    branches: [main, master, develop, homolog]

# Permissões mínimas — o workflow só precisa ler o código do repositório
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Testes automatizados com cobertura de código
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      # a) Checkout do código-fonte
      - name: Checkout código
        uses: actions/checkout@v4

      # b) Configura Python 3.11 com cache de dependências pip
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # c) Instala dependências de produção e teste declaradas no projeto
      - name: Instalar dependências
        run: pip install -r requirements.txt

      # d) Garante pytest e pytest-cov disponíveis (também listados em requirements.txt)
      - name: Instalar pytest
        run: pip install pytest pytest-cov

      # e) Executa a suite de testes com relatório de cobertura em XML
      #    --cov=todo_project: pacote Flask da aplicação (equivalente genérico a --cov=app)
      - name: Executar testes
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-secret-key-not-for-production
          SYSLOG_ENABLED: "false"
          BOOTSTRAP_ADMIN_ENABLED: "false"
        run: pytest tests/ -v --cov=todo_project --cov-report=xml

      # f) Upload opcional de cobertura para Codecov
      #    Configure CODECOV_TOKEN em Settings > Secrets and variables > Actions.
      #    Sem o token, o step é ignorado silenciosamente (continue-on-error).
      - name: Upload coverage para Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Job 2: Verificação de qualidade de código (lint e formatação)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      # a) Checkout do código-fonte
      - name: Checkout código
        uses: actions/checkout@v4

      # b) Configura Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # c) Instala ferramentas de análise estática e formatação
      - name: Instalar flake8 e black
        run: pip install flake8 black

      # d) Verifica estilo e erros comuns no código Python da aplicação
      #    todo_project/todo_project: módulo principal (equivalente genérico a app/)
      - name: Executar flake8
        run: flake8 todo_project/todo_project --max-line-length=120

      # e) Verifica se o código está formatado conforme o padrão Black
      - name: Executar black --check
        continue-on-error: true
        run: black --check todo_project/

  # ---------------------------------------------------------------------------
  # Job 3: Build da imagem Docker (depende de test e lint)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      # a) Checkout do código-fonte
      - name: Checkout código
        uses: actions/checkout@v4

      # b) Configura Docker Buildx para builds otimizados e compatíveis com CI
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # c) Constrói a imagem Docker a partir do Dockerfile na raiz do repositório
      - name: Build imagem Docker
        run: docker build -t task-manager:latest .

      # d) Confirma que a imagem foi criada com sucesso inspecionando seus metadados
      - name: Verificar se build foi bem-sucedido
        run: |
          docker image inspect task-manager:latest --format '{{.Id}}' | grep -q .
          echo "Imagem task-manager:latest criada com sucesso."

name: CI

on:
  pull_request:
    branches: [master, homolog, develop]
  push:
    branches: [develop, homolog, master]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-manager-flask .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:

name: CI

on:
  pull_request:
    branches: [master, homolog, develop]
  push:
    branches: [develop, homolog, master]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-manager-flask .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder — lint será expandido
        run: echo "Lint (ruff/flake8) será implementado nas próximas iterações."

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder — security scan será expandido
        run: echo "Security scan (Trivy, Bandit, etc.) será implementado nas próximas iterações."

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-secret-key-not-for-production
          SYSLOG_ENABLED: "false"
          BOOTSTRAP_ADMIN_ENABLED: "false"
        run: pytest test_app.py -v

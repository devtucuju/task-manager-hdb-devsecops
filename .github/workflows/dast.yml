# =============================================================================
# DAST — Dynamic Application Security Testing
# =============================================================================
# Executa varredura dinâmica com OWASP ZAP contra a aplicação Flask em
# execução via Docker Compose. Dispara em push/PR nas branches main e develop.
#
# Arquitetura dos jobs:
#   start-app  → valida build, sobe stack e confirma health check
#   owasp-zap  → sobe stack localmente (runner isolado) e executa o scan
#   stop-app   → encerra containers (cleanup; roda mesmo em caso de falha)
#
# Nota: cada job do GitHub Actions usa um runner efêmero independente. Por isso
# o job owasp-zap reinicia o docker-compose no próprio runner — não é possível
# reutilizar containers iniciados em start-app via localhost entre jobs.
# =============================================================================

name: DAST - Dynamic Application Security Testing

on:
  # Dispara em pushes diretos às branches de integração e release
  push:
    branches:
      - main
      - develop

  # Dispara em pull requests que visam merge nessas branches
  pull_request:
    branches:
      - main
      - develop

# Permissões mínimas — leitura do repositório e upload de artefatos de scan
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build da imagem, subida da stack e verificação de disponibilidade
  # ---------------------------------------------------------------------------
  start-app:
    name: Start Application
    runs-on: ubuntu-latest

    steps:
      # a) Checkout do código-fonte
      - name: Checkout código
        uses: actions/checkout@v4

      # b) Configura Docker Buildx para builds compatíveis com o runner do CI
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      # Prepara .env mínimo para o stack subir sem segredos de produção
      - name: Criar .env para DAST
        run: |
          cp .env.example .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=dast-ci-secret-key-not-for-production/' .env
          sed -i 's/^FLASK_ENV=.*/FLASK_ENV=production/' .env
          sed -i 's/^SYSLOG_ENABLED=.*/SYSLOG_ENABLED=false/' .env
          sed -i 's/^BOOTSTRAP_ADMIN_ENABLED=.*/BOOTSTRAP_ADMIN_ENABLED=false/' .env

      # c) Build da imagem Docker declarada no Dockerfile da raiz do projeto
      - name: Build imagem Docker
        run: docker build -t task-manager:latest .

      # d) Sobe PostgreSQL, app Flask e demais serviços em segundo plano
      - name: Iniciar containers com docker-compose
        run: docker compose up -d --build

      # e) Aguarda a aplicação responder (health check via rota /about)
      - name: Aguardar aplicação estar pronta
        run: |
          echo "Aguardando health check da aplicação..."
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:5000/about > /dev/null; then
              echo "Aplicação pronta na tentativa ${attempt}."
              exit 0
            fi
            echo "Tentativa ${attempt}/60 — aguardando 5s..."
            sleep 5
          done
          echo "Timeout: aplicação não ficou pronta a tempo."
          docker compose ps
          docker compose logs app --tail 50
          exit 1

      # f) Confirma que o endpoint raiz responde conforme especificado
      - name: Verificar se aplicação está respondendo
        run: |
          curl -f http://localhost:5000
          echo "Aplicação respondendo em http://localhost:5000"

  # ---------------------------------------------------------------------------
  # Job 2: Varredura OWASP ZAP em modo headless (baseline scan)
  # ---------------------------------------------------------------------------
  owasp-zap:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: start-app

    steps:
      # a) Checkout do código-fonte
      - name: Checkout código
        uses: actions/checkout@v4

      # Reinicia stack neste runner (runners são isolados entre jobs)
      - name: Criar .env para DAST
        run: |
          cp .env.example .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=dast-ci-secret-key-not-for-production/' .env
          sed -i 's/^FLASK_ENV=.*/FLASK_ENV=production/' .env
          sed -i 's/^SYSLOG_ENABLED=.*/SYSLOG_ENABLED=false/' .env
          sed -i 's/^BOOTSTRAP_ADMIN_ENABLED=.*/BOOTSTRAP_ADMIN_ENABLED=false/' .env

      - name: Subir stack para o scan
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:5000/about > /dev/null; then
              echo "Stack pronta para o scan ZAP."
              break
            fi
            sleep 5
          done

      # b) Executa OWASP ZAP baseline em modo headless (--network host acessa localhost)
      #    continue-on-error garante upload dos relatórios mesmo com alertas encontrados
      - name: Executar OWASP ZAP em modo headless
        continue-on-error: true
        run: |
          set +e
          docker run --rm --network host \
            -v "${{ github.workspace }}:/zap/wrk:rw" \
            -t owasp/zap2docker-stable \
            zap-baseline.py \
              -t http://localhost:5000 \
              -r zap-report.html \
              -J zap-report.json
          ZAP_EXIT=$?
          # zap-baseline: 0=ok, 1=alertas, 2+=erro técnico
          echo "ZAP exit code: ${ZAP_EXIT}"
          if [ "${ZAP_EXIT}" -ge 2 ]; then
            exit "${ZAP_EXIT}"
          fi

      # c) Relatório JSON já gerado pelo flag -J acima; valida presença dos arquivos
      - name: Gerar relatório JSON
        if: always()
        run: |
          test -f zap-report.json || { echo "zap-report.json não encontrado."; exit 1; }
          test -f zap-report.html || { echo "zap-report.html não encontrado."; exit 1; }
          echo "Relatórios gerados com sucesso."

      # d) Exibe resumo dos alertas encontrados no console do workflow
      - name: Exibir relatório
        if: always()
        run: |
          echo "=== Resumo OWASP ZAP (zap-report.json) ==="
          sudo apt-get update -qq && sudo apt-get install -y -qq jq > /dev/null
          jq -r '
            [.site[]?.alerts[]?]
            | group_by(.riskdesc)
            | map({risk: .[0].riskdesc, count: length})
            | .[]
            | "\(.risk): \(.count) alerta(s)"
          ' zap-report.json || true
          echo ""
          echo "=== Alertas de alto risco / críticos ==="
          jq -r '
            [.site[]?.alerts[]?
             | select(.riskcode == "3" or .riskcode == "4")]
            | .[]
            | "[\(.riskdesc)] \(.name) — \(.desc // "sem descrição" | .[0:120])"
          ' zap-report.json || echo "Nenhum alerta de alto risco."

      # Publica relatórios HTML e JSON como artefatos do workflow
      - name: Upload artefatos dos relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-report.html
            zap-report.json
          retention-days: 30
          if-no-files-found: warn

      # e) Falha o job se houver vulnerabilidades críticas ou de alto risco
      #    riskcode 3 = High, 4 = Critical (quando presente no relatório ZAP)
      - name: Falhar se encontrar vulnerabilidades críticas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq > /dev/null
          HIGH_COUNT=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3" or .riskcode == "4")] | length' zap-report.json)
          if [ "${HIGH_COUNT}" -gt 0 ]; then
            echo "::error::Encontradas ${HIGH_COUNT} vulnerabilidade(s) de alto risco ou crítica(s)."
            exit 1
          fi
          echo "Nenhuma vulnerabilidade crítica ou de alto risco detectada."

      # Cleanup local deste runner após o scan
      - name: Encerrar stack local do scan
        if: always()
        run: docker compose down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # Job 3: Parada dos containers (executa sempre, mesmo se jobs anteriores falharem)
  # ---------------------------------------------------------------------------
  stop-app:
    name: Stop Application
    runs-on: ubuntu-latest
    needs: [start-app, owasp-zap]
    if: always()

    steps:
      # a) Checkout para ter acesso ao docker-compose.yml
      - name: Checkout código
        uses: actions/checkout@v4

      # Encerra qualquer container remanescente neste runner (cleanup defensivo)
      - name: Parar containers
        run: docker compose down -v --remove-orphans
